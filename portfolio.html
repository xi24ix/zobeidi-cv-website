      transform: rotateY(calc(var(--rot-y) * (var(--offset-x) + ((var(--item-size-x) - 1) / 2)) + var(--rot-y-delta, 0deg)))
                 rotateX(calc(calc(var(--rot-x) * (var(--offset-y) - ((var(--item-size-y) - 1) / 2))) + var(--rot-x-delta, 0deg)))

  <script src="./hammer.min.js"></script>
  <script>
  (function() {
    'use strict';

    function initSphereGallery() {
      if (typeof Hammer === 'undefined') {
        setTimeout(initSphereGallery, 50);
        return;
      }

      const MAX_POLAR_ROT_DEG = 12;
      const PAN_SENSITIVITY = 18;
      const TRANSITION_DUR_MS = 300;

      const gallerySection = document.getElementById('sphere-gallery');
      if (!gallerySection) return;

      const DOM = {
        section: gallerySection,
        sphere: gallerySection.querySelector('.sphere'),
        main: gallerySection.querySelector('.sphere-stage-wrapper'),
        items: gallerySection.querySelectorAll('.item__image'),
        frame: gallerySection.querySelector('.frame'),
        viewer: gallerySection.querySelector('.viewer'),
        scrim: gallerySection.querySelector('.scrim'),
        closeBtn: gallerySection.querySelector('.viewer-close-btn'),
      };

      if (!DOM.sphere || !DOM.main) return;

      const state = {
        rotation: { x: 0, y: 0 },
        startRotation: { x: 0, y: 0 },
        inertiaFrame: null,
        cancelTap: false,
        isInteracting: false,
        isEnlarged: false,
      };

      const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

      const applyTransform = () => {
        DOM.sphere.style.transform = 'translateZ(calc(var(--radius) * -1)) rotateX(' + state.rotation.x + 'deg) rotateY(' + state.rotation.y + 'deg)';
      };

      const stopInertia = () => {
        if (state.inertiaFrame) {
          cancelAnimationFrame(state.inertiaFrame);
          state.inertiaFrame = null;
        }
      };

      const startInertia = (velocityX, velocityY) => {
        let vx = velocityX * 100;
        let vy = velocityY * 100;
        const friction = 0.92;
        const minVelocity = 0.1;
        const maxFrames = 120;
        let frameCount = 0;

        const step = () => {
          vx *= friction;
          vy *= friction;
          if (Math.abs(vx) < minVelocity && Math.abs(vy) < minVelocity) {
            state.inertiaFrame = null;
            state.isInteracting = false;
            return;
          }
          const proposedX = state.rotation.x - vy / 200;
          state.rotation.x = clamp(proposedX, -MAX_POLAR_ROT_DEG, MAX_POLAR_ROT_DEG);
          state.rotation.y += vx / 200;
          applyTransform();
          frameCount++;
          if (frameCount > maxFrames) {
            state.inertiaFrame = null;
            state.isInteracting = false;
            return;
          }
          state.inertiaFrame = requestAnimationFrame(step);
        };
        stopInertia();
        state.inertiaFrame = requestAnimationFrame(step);
      };

      const setupGestures = () => {
        const hammer = new Hammer(DOM.main);
        hammer.get('pan').set({ direction: Hammer.DIRECTION_ALL });

        hammer.on('panstart', () => {
          state.cancelTap = true;
          state.isInteracting = true;
          stopInertia();
          state.startRotation.x = state.rotation.x;
          state.startRotation.y = state.rotation.y;
        });

        hammer.on('panmove', (e) => {
          const proposedX = state.startRotation.x - e.deltaY / PAN_SENSITIVITY;
          state.rotation.y = state.startRotation.y + e.deltaX / PAN_SENSITIVITY;
          state.rotation.x = clamp(proposedX, -MAX_POLAR_ROT_DEG, MAX_POLAR_ROT_DEG);
          applyTransform();
        });

        hammer.on('panend', (e) => {
          setTimeout(() => { state.cancelTap = false; }, 120);
          startInertia(e.velocityX, e.velocityY);
        });
      };

      const setupTaps = () => {
        const getTransformRotation = (el) => {
          const str = el.style.transform || '';
          const matchX = str.match(/rotateX\((-?\d+(\.\d+)?)deg\)/);
          const matchY = str.match(/rotateY\((-?\d+(\.\d+)?)deg\)/);
          const rotateX = matchX ? parseFloat(matchX[1]) : 0;
          const rotateY = matchY ? parseFloat(matchY[1]) : 0;
          return { rotateX, rotateY };
        };

        const getRotationXY = (el) => {
          const style = window.getComputedStyle(el);
          const transform = style.transform;
          if (!transform || transform === 'none') {
            return { rotateX: 0, rotateY: 0 };
          }
          if (!transform.startsWith('matrix3d')) {
            return { rotateX: 0, rotateY: 0 };
          }
          const values = transform
            .match(/matrix3d\((.+)\)/)[1]
            .split(',')
            .map(parseFloat);
          const rotateX = Math.asin(-values[9]) * (180 / Math.PI);
          const rotateY = Math.atan2(values[8], values[10]) * (180 / Math.PI);
          return { rotateX: isNaN(rotateX) ? 0 : rotateX, rotateY: isNaN(rotateY) ? 0 : rotateY };
        };

        const handleClickScrim = () => {
          const el = DOM.section.querySelector('[data-focused="true"]');
          if (!el) return;
          const parentEl = el.parentNode;
          const referenceDiv = DOM.section.querySelector('.item__image--reference');
          if (referenceDiv) referenceDiv.remove();
          const enlargedImg = DOM.section.querySelector('.enlarge');
          if (enlargedImg) enlargedImg.remove();
          parentEl.style.setProperty('--rot-y-delta', '0deg');
          parentEl.style.setProperty('--rot-x-delta', '0deg');
          el.style.transform = '';
          el.style.zIndex = 0;
          setTimeout(() => {

            el.setAttribute('data-focused', 'false');
            state.isEnlarged = false;

        const handleClick = (e) => {
          if (state.cancelTap || state.isEnlarged) return;
          const el = e.currentTarget;
          const parentEl = el.parentNode;
          if (!parentEl) return;

          el.setAttribute('data-focused', 'true');
          state.isEnlarged = true;
          stopInertia();

          const parentRotation = getRotationXY(parentEl);
          const globalRotation = getTransformRotation(DOM.sphere);
          const normalizeDegrees = (deg) => ((deg % 360) + 360) % 360;
          const parentY = normalizeDegrees(parentRotation.rotateY);
          const globalY = normalizeDegrees(globalRotation.rotateY);
          let rotY = -(parentY + globalY) % 360;
          if (rotY < -180) rotY += 360;
          parentEl.style.setProperty('--rot-y-delta', rotY + 'deg');

          const rotX = -parentRotation.rotateX - globalRotation.rotateX;
          parentEl.style.setProperty('--rot-x-delta', rotX + 'deg');

          const referenceDiv = document.createElement('div');
          parentEl.appendChild(referenceDiv);
          referenceDiv.style.opacity = '0';
          referenceDiv.classList.add('item__image', 'item__image--reference');
          referenceDiv.style.transform = 'rotateX(' + (-parentRotation.rotateX) + 'deg) rotateY(' + (-parentRotation.rotateY) + 'deg)';

          const sourceRect = referenceDiv.getBoundingClientRect();
          const targetRect = DOM.frame.getBoundingClientRect();
          const deltaScaleX = targetRect.width / (sourceRect.width || 1);
          const deltaScaleY = targetRect.height / (sourceRect.height || 1);
          const deltaScale = Math.min(deltaScaleX, deltaScaleY);
          el.style.transform = 'scale(' + deltaScale + ') translateZ(30px)';
          el.style.zIndex = 10;

          const img = document.createElement('img');
          const imgSrc = parentEl.getAttribute('data-src');
          img.src = imgSrc;
          img.alt = 'Enlarged project view';

          DOM.scrim.addEventListener('click', handleClickScrim, { once: true });
          if (DOM.closeBtn) {
            DOM.closeBtn.onclick = handleClickScrim;
          }

          setTimeout(() => {
            const renderedRect = el.getBoundingClientRect();
            const mainRect = DOM.main.getBoundingClientRect();
            const enlargementEl = document.createElement('div');
            Object.assign(enlargementEl.style, {
              top: (renderedRect.top - mainRect.top) + 'px',
              left: (renderedRect.left - mainRect.left) + 'px',
              width: renderedRect.width + 'px',
              height: renderedRect.height + 'px',
              opacity: '0',
            });
            setTimeout(() => {
              enlargementEl.style.opacity = '1';
              document.body.setAttribute('data-enlarging', 'true');
            }, 30);
            enlargementEl.classList.add('enlarge');
            enlargementEl.appendChild(img);
            DOM.viewer.appendChild(enlargementEl);
          }, TRANSITION_DUR_MS);
        };

        DOM.items.forEach((el) => el.addEventListener('click', handleClick));

        // Keyboard navigation (ESC to close lightbox)
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && state.isEnlarged) {
            handleClickScrim();
          }
        });
      };

      // Idle auto-rotation
      const autoRotate = () => {
        if (!state.isInteracting && !state.isEnlarged && !state.inertiaFrame) {
          state.rotation.y += 0.05;
          applyTransform();
        }
        requestAnimationFrame(autoRotate);
      };

      setupGestures();
      setupTaps();
      requestAnimationFrame(autoRotate);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSphereGallery);
    } else {
      initSphereGallery();
    }
  })();
